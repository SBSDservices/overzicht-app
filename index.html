<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Overzicht</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Vandaag</h1>
  <p id="datum-vandaag" class="info"></p>

  <!-- Verbinding met Google (agenda + taken synchroniseren) -->
  <div id="google-balk">
    <span id="google-tekst">Google wordt geladen…</span>
    <button id="google-knop">Verbinden met Google</button>
    <button id="google-uitlog" class="verborgen" onclick="logUit()">Uitloggen</button>
  </div>

  <!-- Formulier om iets nieuws toe te voegen -->
  <form id="formulier">
    <input id="titel" placeholder="Wat moet je doen of waar moet je zijn?" required>

    <select id="soort">
      <option value="taak">✅ Taak</option>
      <option value="deadline">⏰ Deadline</option>
      <option value="afspraak">📅 Afspraak</option>
    </select>

    <input id="datum" type="date" class="verborgen">
    <input id="begintijd" type="time" class="verborgen">
    <input id="eindtijd" type="time" class="verborgen">

    <button type="submit">Toevoegen</button>
  </form>

  <div class="sectie-kop">
    <h2>📅 Afspraken</h2>
    <select id="periode">
      <option value="2">Vandaag &amp; morgen</option>
      <option value="7">Komende 7 dagen</option>
      <option value="30">Komende 30 dagen</option>
    </select>
  </div>
  <ul id="lijst-afspraak"></ul>

  <div class="sectie-kop">
    <h2>⏰ Deadlines</h2>
  </div>
  <ul id="lijst-deadline"></ul>

  <div class="sectie-kop">
    <h2>✅ Taken</h2>
  </div>
  <ul id="lijst-taak"></ul>

  <!-- De JavaScript-bestanden: eerst de app, dan de Google-koppeling -->
  <script src="app.js"></script>
  <script src="google.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="startGoogle()"></script>
</body>

</html>
